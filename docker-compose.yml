services:
  ruijie-config-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruijie-config-generator
    command: ["backend"]
    ports:
      - "3001:3001"
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - influxdb
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://ruijie:ruijiepass@postgres:5432/ruijiedb
      - REDIS_URL=redis://redis:6379
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=ruijie-secret-fleet-token-12345
      - INFLUX_ORG=ruijie_fleet
      - INFLUX_BUCKET=switch_metrics
      - GRPC_COLLECTOR_IP=${GRPC_COLLECTOR_IP:-10.23.9.10}
      - GRPC_COLLECTOR_PORT=${GRPC_COLLECTOR_PORT:-50051}
      - DISABLE_AUTH=${DISABLE_AUTH:-false}
      - JWT_SECRET=${JWT_SECRET:-m5Qu7yONikydmI3hDDK4ZDE9}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}

  ruijie-grpc-listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruijie-grpc-listener
    command: ["listener"]
    ports:
      - "50051:50051"
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - influxdb
    environment:
      - GRPC_PORT=${GRPC_PORT:-50051}
      - DATABASE_URL=postgresql://ruijie:ruijiepass@postgres:5432/ruijiedb
      - REDIS_URL=redis://redis:6379
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=ruijie-secret-fleet-token-12345
      - INFLUX_ORG=ruijie_fleet
      - INFLUX_BUCKET=switch_metrics
      - GNMIC_PATH=/usr/local/bin/gnmic

  postgres:
    image: postgres:16-alpine
    container_name: ruijie-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ruijie
      - POSTGRES_PASSWORD=ruijiepass
      - POSTGRES_DB=ruijiedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ruijie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  influxdb:
    image: influxdb:2.7-alpine
    container_name: ruijie-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=ruijie
      - DOCKER_INFLUXDB_INIT_PASSWORD=ruijiepass1234
      - DOCKER_INFLUXDB_INIT_ORG=ruijie_fleet
      - DOCKER_INFLUXDB_INIT_BUCKET=switch_metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=ruijie-secret-fleet-token-12345
    volumes:
      - influxdb_data:/var/lib/influxdb2

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
