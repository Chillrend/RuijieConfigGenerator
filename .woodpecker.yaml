when:
  - branch: main
    event: [push, manual]
  - event: tag

steps:
  build-branch:
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: images.pnj.ac.id
      repo: pnjacid/ruijie-config-generator
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_PASSWORD
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
    when:
      branch: main
      event: [push, manual]

  auto-tag:
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - sh scripts/auto-tag.sh
    when:
      branch: main
      event: push

  build-tag:
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: images.pnj.ac.id
      repo: pnjacid/ruijie-config-generator
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_PASSWORD
      tags:
        - latest
        - ${CI_COMMIT_TAG}
    when:
      event: tag
